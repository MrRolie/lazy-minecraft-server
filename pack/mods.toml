# Vanilla Extended — the pack, as code (design: option A, 2026-09-29).
# Build: python3 pack/build.py [--chapter N] [--update]. The resolved exact versions live in pack/lock.json.
#
# side:    server = server only (client: unsupported)   client = client only (server: unsupported)   both
# chapter: 1 = launch; later chapters only ADD mods (removing a mod deletes its blocks/items from the world).
# Cut after the 2026-09-29 spike:
#   end-remastered-additions — its advancement override breaks End Remastered's whole eye-hunt tab without BOMD/Aether
#   mes-moogs-end-structures + moogs-structure-lib — ~0 structures inside the End rings; one /locate tripped the watchdog
# pin:     optional exact Modrinth version id; otherwise --update takes the newest release (pre-release only if
#          no release exists, flagged loudly).
# freeze:  true = --update never moves it; it keeps its locked version, like a pin. Set on every mod whose update
#          can change world generation or already-generated content. Only an explicit pin (or removing freeze)
#          moves it, and that is a chapter-grade change: backup, rehearse on a copy, announce.

[pack]
name = "Vanilla Extended"
minecraft = "26.1.2"
fabric_loader = "0.19.5"
version = "1.0.2"   # 1.0.2 = 1.0.1 + client-overrides/servers.dat (server side byte-identical); = compose MOTD

